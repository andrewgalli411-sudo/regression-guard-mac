<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>regression.guard</title>
<style>
  :root {
    /* Surfaces */
    --bg: #0B0D0E;
    --surface: #13161A;
    --elevated: #1B1F24;

    /* Borders */
    --border: #2E343A;
    --border-subtle: #262C33;
    --border-strong: #6E7681;

    /* Text */
    --text: #E6EDF3;
    --muted: #8B949E;
    --dim: #6E7681;
    --text-inverse: #0D1117;

    /* Brand */
    --brand-primary: #1F883D;
    --brand-accent: #2EA043;
    --brand-pressed: #166B33;

    /* States */
    --state-pass: #1F883D;
    --state-fail: #DA3633;
    --state-regress: #D29922;
    --state-running: #1F6FEB;
    --state-skipped: #8B949E;

    /* Danger */
    --danger: #DA3633;
    --danger-subtle: #FFA198;

    /* Fonts */
    --font-chrome: "Geist Mono", ui-monospace, "SF Mono", monospace;
    --font-body: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --font-user-content: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @font-face {
    font-family: "Geist Mono";
    src: url("./fonts/GeistMono-Regular.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Geist Mono";
    src: url("./fonts/GeistMono-Medium.woff2") format("woff2");
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("./fonts/Inter-Regular.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("./fonts/Inter-Medium.woff2") format("woff2");
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("./fonts/JetBrainsMono-Regular.woff2") format("woff2");
    font-weight: 400 500;
    font-display: swap;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    height: 100vh;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  body { display: flex; flex-direction: column; padding: 32px 36px; gap: 10px; }

  /* ── Header ── */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; }
  .close {
    color: var(--dim); cursor: pointer; font-size: 20px;
    line-height: 1; padding: 0 2px;
  }
  .close:hover { color: var(--text); }

  /* ── Score header card ── */
  .score-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    background: var(--surface);
    border-radius: 8px;
    border: 1px solid var(--border);
    flex-shrink: 0;
    margin-bottom: 24px;
  }
  .score-ring-wrap {
    position: relative;
    width: 80px;
    height: 80px;
    flex-shrink: 0;
  }
  .score-ring-wrap svg { display: block; }
  .score-number {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
    font-family: var(--font-body);
    -webkit-user-select: text;
    user-select: text;
  }
  .score-meta { flex: 1; min-width: 0; }
  .score-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .score-summary {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.45;
  }

  /* ── Section label ── */
  .section-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-family: var(--font-chrome);
    flex-shrink: 0;
  }

  /* ── Issue cards ── */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    padding-right: 4px;
  }

  /* ── Popup shell (sticky header + scrolling cards + sticky footer) ── */
  .popup-shell {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }
  .header-fixed {
    flex-shrink: 0;
    padding-bottom: 12px;
  }
  .bottom-actions-fixed {
    flex-shrink: 0;
    padding-top: 8px;
    display: flex;
    gap: 8px;
  }
  .bottom-actions-fixed button { flex: 1; padding: 9px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: background 120ms;
  }
  .card:hover { background: var(--elevated); }
  .card-body {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .card-cat {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: var(--font-chrome);
  }
  .card-chevron { transition: transform 120ms; }
  .card.open .card-chevron { transform: rotate(90deg); }
  .card-count {
    font-family: var(--font-chrome);
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin-left: 4px;
  }
  .card-desc-list {
    display: none;
    list-style: none;
    padding: 0 14px 12px 14px;
    margin: 0;
  }
  .card.open .card-desc-list { display: block; }
  .card-desc-list li {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
    padding: 6px 0 6px 12px;
    border-left: 2px solid var(--border);
    margin-bottom: 4px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .card-desc-list li:last-child { margin-bottom: 0; }
  .card.open { margin: 4px 0; }
  .card-expanded {
    display: none;
    padding: 0 14px 12px 14px;
  }
  .card.open .card-expanded { display: flex; gap: 8px; }

  /* ── Buttons ── */
  button {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    padding: 10px 18px;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 4px;
    flex-shrink: 0;
  }
  button.primary {
    background: var(--brand-primary);
    color: var(--text-inverse);
    border-color: var(--brand-primary);
  }
  button:hover { border-color: var(--muted); }
  button.primary:hover { background: var(--brand-pressed); border-color: var(--brand-pressed); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--muted);
  }
  button.ghost:hover { color: var(--text); border-color: var(--border); }

  /* Bottom action row (shown on score view) */
  .bottom-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .bottom-actions button { flex: 1; padding: 9px; }

  /* ── Rewrite result view ── */
  .rewrite-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .rewrite-block {
    background: var(--surface);
    border-radius: 6px;
    padding: 12px;
    font-family: var(--font-user-content);
    font-size: 12px;
    line-height: 1.6;
    overflow-y: auto;
    flex: 1;
    -webkit-user-select: text;
    user-select: text;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ── Loading ── */
  .loading {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 13px;
  }

  /* ── Error ── */
  .error-card {
    background: rgba(218,54,51,0.12);
    border: 1px solid rgba(218,54,51,0.3);
    border-radius: 6px;
    padding: 14px;
    font-size: 13px;
    color: var(--danger);
    line-height: 1.5;
    flex-shrink: 0;
  }

  /* ── Upgrade card ── */
  .upgrade-card {
    background: rgba(232,152,91,0.10);
    border: 1px solid rgba(232,152,91,0.25);
    border-radius: 6px;
    padding: 14px;
    flex-shrink: 0;
  }
  .upgrade-card p {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 10px;
    line-height: 1.5;
  }
  .upgrade-btn {
    width: 100%;
    background: var(--brand-primary);
    color: var(--text-inverse);
    border: none;
    border-radius: 4px;
    padding: 10px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .upgrade-btn:hover { background: var(--brand-pressed); }

  /* ── No issues ── */
  .no-issues {
    background: rgba(46,160,67,0.08);
    border: 1px solid rgba(46,160,67,0.2);
    border-radius: 6px;
    padding: 14px;
    font-size: 13px;
    color: var(--brand-accent);
    line-height: 1.5;
    text-align: center;
    flex-shrink: 0;
  }

  /* ── Inline rewrite loading in card ── */
  .card-rewriting {
    padding: 8px 12px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 48 24" width="32" height="16" style="vertical-align: middle;">
        <polyline points="10,4 4,4 4,20 10,20" fill="none" stroke="#2EA043" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square"/>
        <polyline points="38,4 44,4 44,20 38,20" fill="none" stroke="#2EA043" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square"/>
        <circle cx="24" cy="12" r="2.5" fill="#2EA043"/>
      </svg>
      <span style="margin-left: 8px; font-family: var(--font-chrome); font-size: 14px; font-weight: 500; color: var(--text); letter-spacing: -0.01em;">regression.guard</span>
    </div>
    <span class="close" id="close" aria-label="Close">×</span>
  </div>
  <div id="content" style="display:contents;"></div>
  <script type="module" src="./result-renderer.js"></script>
</body>
</html>
