[project]
name = "mcp-audit"
version = "0.1.0"
description = "Audit how reliably an LLM picks the right tool from an MCP server (selection-only measurement + report)."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2",
    "anthropic>=1.4",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
]

[project.scripts]
mcp-audit = "mcp_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_audit"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
