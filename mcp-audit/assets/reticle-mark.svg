<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="reticle">
  <g fill="none" stroke="#0A0A0A" stroke-width="7" stroke-linecap="round">
    <!-- ring: four arcs with gaps at the cardinal points -->
    <path d="M75.1 56.7 A26 26 0 0 1 56.7 75.1"/>
    <path d="M43.3 75.1 A26 26 0 0 1 24.9 56.7"/>
    <path d="M24.9 43.3 A26 26 0 0 1 43.3 24.9"/>
    <path d="M56.7 24.9 A26 26 0 0 1 75.1 43.3"/>
    <!-- cardinal ticks, crossing the ring gaps -->
    <path d="M63 50 H87"/>
    <path d="M50 63 V87"/>
    <path d="M37 50 H13"/>
    <path d="M50 37 V13"/>
  </g>
  <!-- locked-on center: the single accent -->
  <circle cx="50" cy="50" r="6" fill="#30D158"/>
</svg>
